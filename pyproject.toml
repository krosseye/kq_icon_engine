[project]
name = "kq-icon-engine"
version = "0.1.0"
description = "Phosphor icons for PySide6 applications."
license = { file = "LICENSE" }
readme = "README.md"
authors = [
  { name = "KROSSEYE", email = "30990184+KROSSEYE@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = ["pyside6>=6.12.0"]

[project.scripts]
kq-icon-demo = "kq_icon_demo.main:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["kq_icon_engine", "kq_icon_demo"]

[dependency-groups]
dev = [
  "mypy>=2.4.0,<3.0.0",
  "prek>=0.5.0,<1.0.0",
  "pytest>=8,<10",
  "ruff>=0.17.0,<1.0.0",
]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
