[project]
name = "kq-icon-engine"
version = "0.1.1"
description = "Phosphor icons for PySide6 applications."
license = "MIT"
license-files = ["LICENSE", "src/kq_icon_engine/icons/LICENSE"]
readme = "README.md"
authors = [
  { name = "KROSSEYE", email = "30990184+KROSSEYE@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = ["pyside6-essentials>=6.12.0"]

[project.urls]
Homepage = "https://github.com/krosseye/kq_icon_engine"
Changelog = "https://github.com/krosseye/kq_icon_engine/blob/main/CHANGELOG.md"
Issues = "https://github.com/krosseye/kq_icon_engine/issues"

[project.scripts]
kq-icon-demo = "kq_icon_demo.main:main"

[project.entry-points.pyinstaller40]
hook-dirs = "kq_icon_engine.__pyinstaller:get_hook_dirs"

[build-system]
requires = ["uv_build>=0.8.15,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["kq_icon_engine", "kq_icon_demo"]

[dependency-groups]
dev = [
  "mypy>=2.4.0,<3.0.0",
  "prek>=0.5.0,<1.0.0",
  "pytest>=8,<10",
  "python-semantic-release>=10.0.0,<11.0.0",
  "ruff>=0.17.0,<1.0.0",
  "types-pyinstaller>=6.0,<7.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
