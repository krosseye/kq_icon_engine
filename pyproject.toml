[project]
name = "kq-icon-engine"
version = "0.1.0"
description = "Phosphor icons for PySide6 applications."
license = { file = "LICENSE" }
readme = "README.md"
authors = [
  { name = "KROSSEYE", email = "30990184+KROSSEYE@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = ["pyside6>=6.8.0"]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.20,<2.0.0", "prek>=0.3.0,<1.0.0", "ruff>=0.15.0,<1.0.0"]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
