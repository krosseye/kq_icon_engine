[project]
name = "kq-icon-engine"
version = "0.1.0"
description = "Phosphor icons for PySide6 applications."
license = { file = "LICENSE" }
readme = "README.md"
authors = [
  { name = "KROSSEYE", email = "30990184+KROSSEYE@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = ["pyside6>=6.12.0"]

[project.scripts]
kq-icon-demo = "kq_icon_demo.main:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["kq_icon_engine", "kq_icon_demo"]

[dependency-groups]
dev = [
  "mypy>=2.4.0,<3.0.0",
  "prek>=0.5.0,<1.0.0",
  "pytest>=8,<10",
  "python-semantic-release>=10.0.0,<11.0.0",
  "ruff>=0.17.0,<1.0.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "(main|master)"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
