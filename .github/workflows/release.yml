name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  uv-release:
    needs: tests
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Release exactly the commit that passed tests
      - name: Force branch to workflow commit
        run: git reset --hard ${{ github.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync --locked

      - name: Create release version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run semantic-release version --push --vcs-release --changelog
          # HEAD only gets a tag when a new version was released (docs/chore commits don't bump)
          if [ -n "$(git tag --points-at HEAD)" ]; then echo "released=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build distribution
        if: steps.release.outputs.released == 'true'
        run: uv build

      - name: Publish distribution
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release publish
