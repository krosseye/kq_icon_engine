name: Tests

on:
  push:
    branches:
      # main is tested by release.yml, which calls this workflow before releasing.
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: uv sync --locked

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

  freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: uv sync --locked

      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0

      - name: Freeze and run smoke app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pyinstaller --noconfirm --onedir --name freeze_smoke tests/freeze_smoke.py
          ./dist/freeze_smoke/freeze_smoke
